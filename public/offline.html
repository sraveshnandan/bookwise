<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookWise - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
    }
    
    .container {
      text-align: center;
      max-width: 400px;
      padding: 40px 20px;
    }
    
    .icon {
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      font-size: 48px;
    }
    
    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }
    
    p {
      font-size: 18px;
      opacity: 0.9;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    
    .features {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 32px;
      text-align: left;
    }
    
    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }
    
    .feature-icon {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    
    .feature-text {
      font-size: 14px;
      opacity: 0.9;
    }
    
    .retry-btn {
      background: white;
      color: #0ea5e9;
      border: none;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }
    
    .retry-btn:active {
      transform: translateY(0);
    }
    
    .status {
      margin-top: 24px;
      font-size: 14px;
      opacity: 0.7;
    }
    
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 8px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📚</div>
    
    <h1>You're Offline</h1>
    
    <p>No internet connection detected. Some features may be limited.</p>
    
    <div class="features">
      <div class="feature">
        <span class="feature-icon">📖</span>
        <span class="feature-text">Downloaded books available</span>
      </div>
      <div class="feature">
        <span class="feature-icon">🎧</span>
        <span class="feature-text">Downloaded audiobooks ready</span>
      </div>
      <div class="feature">
        <span class="feature-icon">📝</span>
        <span class="feature-text">Saved summaries accessible</span>
      </div>
      <div class="feature">
        <span class="feature-icon">✏️</span>
        <span class="feature-text">Notes & highlights saved locally</span>
      </div>
    </div>
    
    <button class="retry-btn" onclick="window.location.reload()">
      Try Again
    </button>
    
    <div class="status">
      <span id="connection-status">Checking connection...</span>
      <span class="spinner"></span>
    </div>
  </div>
  
  <script>
    const statusEl = document.getElementById('connection-status');
    let checkInterval;
    
    function checkConnection() {
      fetch('/manifest.json', { method: 'HEAD', cache: 'no-cache' })
        .then(() => {
          statusEl.textContent = 'Back online! Reloading...';
          statusEl.style.color = '#86efac';
          clearInterval(checkInterval);
          setTimeout(() => window.location.reload(), 1000);
        })
        .catch(() => {
          statusEl.textContent = 'Still offline. Retrying in 5s...';
        });
    }
    
    checkConnection();
    checkInterval = setInterval(checkConnection, 5000);
    
    window.addEventListener('online', () => {
      statusEl.textContent = 'Back online! Reloading...';
      statusEl.style.color = '#86efac';
      clearInterval(checkInterval);
      setTimeout(() => window.location.reload(), 1000);
    });
  </script>
</body>
</html>
